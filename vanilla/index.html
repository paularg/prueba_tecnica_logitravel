<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technical proof · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1 class="cardTitle">This is a technical proof</h1>
      <p class="cardText">
        Lorem ipsum dolor sit amet consectetur adipiscing, elit mus primis nec
        inceptos. Lacinia habitasse arcu molestie maecenas cursus quam nunc,
        hendrerit posuere augue fames dictumst placerat porttitor, dis mi
        pharetra vestibulum venenatis phasellus.
      </p>

      <!-- Items are rendered from JS (state.items) -->
      <ul
        id="list"
        class="list"
        role="listbox"
        aria-label="Items"
        aria-multiselectable="true"
      ></ul>

      <div class="actions">
        <div class="actionsGroup">
          <button
            id="undo-btn"
            type="button"
            class="btn btnOutline btnIcon"
            aria-label="Undo"
            disabled
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <polyline points="3 3 3 9 9 9" />
            </svg>
          </button>
          <button id="delete-btn" type="button" class="btn btnOutline" disabled>
            Delete
          </button>
        </div>
        <button id="open-modal-btn" type="button" class="btn btnPrimary">
          Add
        </button>
      </div>
    </main>

    <dialog id="modal" class="modal">
      <form id="item-form" method="dialog">
        <label class="modalLabel" for="item-input">Add item to list</label>
        <input
          class="modalInput"
          id="item-input"
          type="text"
          placeholder="Type the text here..."
          autocomplete="off"
        />
        <div class="modalActions">
          <button type="submit" class="btn btnPrimary">Add</button>
          <button id="cancel-btn" type="button" class="btn btnOutline">
            Cancel
          </button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
